name: fuzz

on:
  pull_request:
  schedule:
    # Nightly long-run at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      numRuns:
        description: "Iterations per property"
        required: false
        default: "100000"
      seed:
        description: "Optional fixed seed for reproduction"
        required: false
        default: ""

jobs:
  fuzz:
    name: Property-based fuzz (fast-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # Bounded on PRs, long-run on the nightly schedule / manual dispatch.
      FUZZ_NUM_RUNS: ${{ github.event_name == 'pull_request' && '200' || (github.event.inputs.numRuns || '100000') }}
      FUZZ_SEED: ${{ github.event.inputs.seed || '' }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run fuzz suite
        run: npx jest --config jest.fuzz.config.js --runInBand
      - name: Upload seed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-seed-report
          path: fuzz-seed-report.json
          if-no-files-found: ignore
