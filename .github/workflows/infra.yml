---
# Terraform CI — validates, lints, and security-scans infrastructure code on
# every PR that touches infra/.  Adds an Infracost cost estimate comment.
# No production apply automation — applies are manual.
#
# Secrets required (set in repo Settings → Secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  — e.g. projects/123/locations/global/workloadIdentityPools/...
#   GCP_SERVICE_ACCOUNT             — terraform CI SA (roles/editor scoped to staging project)
#   INFRACOST_API_KEY               — from infracost.io

name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write   # needed for Workload Identity Federation

env:
  TF_VERSION: "1.7.5"
  TFLINT_VERSION: "0.50.3"
  WORKING_DIR: infra/terraform/environments/staging

jobs:
  # ── fmt + validate ──────────────────────────────────────────────────────────
  validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive ../../

      - name: Authenticate to GCP (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

  # ── tflint ─────────────────────────────────────────────────────────────────
  tflint:
    name: TFLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init
        working-directory: infra/terraform

      - name: Run TFLint
        run: tflint --recursive --format compact
        working-directory: infra/terraform

  # ── checkov security scan ───────────────────────────────────────────────────
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          # Suppress low-severity findings; fail only on HIGH/CRITICAL
          soft_fail: false
          check: "HIGH,CRITICAL"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # ── terraform plan ──────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan (staging)
    runs-on: ubuntu-latest
    needs: [validate, tflint]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=terraform/staging"

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan.binary 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n…(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — staging\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ── Infracost cost estimate ─────────────────────────────────────────────────
  infracost:
    name: Infracost estimate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost baseline (base branch)
        run: |
          infracost breakdown \
            --path infra/terraform/environments/staging \
            --format json \
            --out-file /tmp/infracost-base.json

      - name: Generate Infracost diff
        run: |
          infracost diff \
            --path infra/terraform/environments/staging \
            --format json \
            --compare-to /tmp/infracost-base.json \
            --out-file /tmp/infracost-diff.json

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo $GITHUB_REPOSITORY \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --behavior update
