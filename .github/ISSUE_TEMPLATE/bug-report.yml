name: Bug Report
description: Report a bug you found while using or working on vortex-backend.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out as much of the form as possible so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: What should have happened instead?
      placeholder: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Start the server with `npm run dev`
        2. Send `POST /api/v1/intents` with body `{ ... }`
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any stack traces, structured log lines, or Sentry event IDs here.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      description: What version or git SHA are you running?
      placeholder: e.g. 0.1.0 or abc1234
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Testnet
        - Mainnet / production
        - CI
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have included enough information to reproduce the issue.
          required: true
