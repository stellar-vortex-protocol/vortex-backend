version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Every action pin lands as one PR. A pin bump is a supply-chain change
    # (see SECURITY.md), so it should be reviewable as a single diff of "these
    # are the actions that changed" rather than as a dozen one-line PRs, and a
    # single PR is what lets a reviewer spot "one unexpected action moved".
    groups:
      github-actions:
        patterns:
          - "*"
