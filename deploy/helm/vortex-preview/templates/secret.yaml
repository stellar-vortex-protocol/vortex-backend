{{/*
The preview's only Secret. Holds the per-run throwaway testnet signing key and
the per-run random database password.

`stringData` keeps the template readable; Kubernetes base64-encodes it on
write. The values arrive from the workflow as masked `--set-string` flags, so
they are visible neither in the Actions log nor in this repo — and even if a
release Secret were read back, both values are worthless outside this
namespace's lifetime by construction.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vortex-preview.fullname" . }}-env
  labels:
    {{- include "vortex-preview.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "vortex-preview.databaseUrl" . | quote }}
  # Kept as its own key because the official Postgres image wants the bare
  # password while the app wants the connection string. Both derive from the
  # same per-run value, so they cannot drift apart.
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  SOROBAN_SIGNING_KEY: {{ .Values.app.signingKey | quote }}
