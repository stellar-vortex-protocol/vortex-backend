# Minimal Tempo for the local observability profile (issue #481).
#
# The service does not emit spans yet, so nothing writes here. It is
# provisioned so that enabling tracing is a configuration change and a Grafana
# datasource, not a dashboard rebuild. When spans are added, push them to
# :4318 (OTLP/HTTP) from the app; the local Tempo also needs the app added to
# the traces_writer below before logs->traces correlation resolves.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# No metrics_generator: the dashboards do not use service graphs or span
# metrics, and leaving it off keeps the local stack from spending CPU on
# RED-metric-by-trace panels nobody has asked for.
usage_report:
  reporting_enabled: false
